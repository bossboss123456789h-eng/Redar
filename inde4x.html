<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فهد سنك | FAHAD SYNC FITNESS PRO</title>
    <meta name="description" content="منصة التدريب الرياضي الذكية - تمرّن • سجّل • تطوّر">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg: #0a0e17;
            --card: #131a2b;
            --card2: #1a2338;
            --text: #f1f5f9;
            --text-secondary: #8b98a9;
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --danger: #ff4757;
            --warning: #ffa502;
            --blue: #00d2ff;
            --purple: #a855f7;
            --pink: #ff6b9d;
            --gold: #ffd700;
            --border: #233045;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', Tahoma, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 210, 255, 0.05) 0%, transparent 50%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent), var(--blue));
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* App Container */
        .app {
            width: min(1200px, 100%);
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            margin: -20px -20px 20px -20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .logo h1 {
            font-size: 18px;
            margin: 0;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            font-size: 11px;
            color: var(--text-secondary);
            margin: 0;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Cards */
        .card {
            background: linear-gradient(145deg, var(--card), var(--card2));
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: all var(--transition);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1), transparent);
            border-radius: 50%;
        }

        .card:hover {
            border-color: rgba(0, 255, 136, 0.3);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        /* Grid Layout */
        .grid {
            display: grid;
            gap: 15px;
        }

        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }

        /* Stats Cards */
        .stat-card {
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1), transparent);
            transition: all 0.5s;
        }

        .stat-card:hover::after {
            bottom: 0;
            right: 0;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
            position: relative;
            z-index: 1;
        }

        .stat-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
        }

        .stat-card .emoji {
            font-size: 32px;
            position: relative;
            z-index: 1;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            font-family: var(--font);
            min-height: 48px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
        }

        .btn-secondary {
            background: var(--card2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ff6b81);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }

        .btn-blue {
            background: linear-gradient(135deg, var(--blue), #00a8cc);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #ffb347);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 165, 2, 0.3);
        }

        .btn-purple {
            background: linear-gradient(135deg, var(--purple), #c084fc);
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-pink {
            background: linear-gradient(135deg, var(--pink), #ff8fab);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #ffd700);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
            min-height: 36px;
        }

        .btn-lg {
            padding: 18px 36px;
            font-size: 18px;
            min-height: 60px;
        }

        .btn-block {
            width: 100%;
        }

        .btn-icon {
            padding: 10px;
            min-width: 44px;
            min-height: 44px;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            border-radius: 6px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-bar .fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Inputs */
        input, select, textarea {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--text);
            font-size: 14px;
            font-family: var(--font);
            transition: all var(--transition);
            margin-bottom: 10px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        /* Exercise Cards */
        .exercise-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            cursor: pointer;
            transition: all var(--transition);
            background: linear-gradient(145deg, var(--card2), var(--card));
            position: relative;
            overflow: hidden;
        }

        .exercise-card::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .exercise-card:hover::before {
            opacity: 1;
        }

        .exercise-card:hover {
            border-color: var(--accent);
            transform: translateX(-5px);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.1);
        }

        .exercise-card.current {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.2);
        }

        .exercise-card .emoji {
            font-size: 36px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 10px;
            padding: 10px;
        }

        .exercise-card .info {
            flex: 1;
        }

        .exercise-card .name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .exercise-card .meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Set Rows */
        .set-row {
            display: grid;
            grid-template-columns: 60px 1fr 1fr 60px;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: var(--card2);
            border-radius: var(--radius-sm);
        }

        .set-row input {
            padding: 10px;
            text-align: center;
            margin: 0;
        }

        .set-num {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .check-btn {
            width: 100%;
            height: 45px;
            border-radius: var(--radius-sm);
            background: var(--border);
            color: var(--text);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            font-weight: 600;
        }

        .check-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .check-btn.done {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border-color: var(--accent);
        }

        /* Timer */
        .timer-display {
            font-size: 72px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, var(--accent), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            position: relative;
        }

        .timer-display::after {
            content: '⏱️';
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 30px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s;
        }

        .modal {
            background: linear-gradient(145deg, var(--card), var(--card2));
            border-radius: var(--radius);
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            animation: slideUp 0.3s;
            position: relative;
        }

        .modal .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1;
        }

        .modal .close-btn:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, var(--card), var(--card2));
            color: var(--text);
            padding: 16px 28px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            z-index: 3000;
            font-weight: 600;
            animation: slideDown 0.3s ease;
            border: 1px solid var(--border);
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .toast.success {
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }

        .toast.error {
            border-color: var(--danger);
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.3);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin: 10px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid var(--border);
            background: var(--card2);
            position: relative;
        }

        .calendar-day:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow);
        }

        .calendar-day.completed {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
        }

        .calendar-day.current {
            background: linear-gradient(135deg, var(--blue), #00a8cc);
            color: white;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .calendar-day.rest {
            background: var(--border);
            color: var(--text-secondary);
        }

        .calendar-day.future {
            background: var(--card2);
            color: var(--text-secondary);
        }

        /* Video Section */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: var(--radius-sm);
            margin: 10px 0;
            box-shadow: var(--shadow);
            background: var(--card2);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Workout Mode */
        .mode-btn {
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--card2);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .mode-btn:hover::before {
            left: 100%;
        }

        .mode-btn.active {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2);
        }

        .mode-btn .mode-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .mode-btn .mode-name {
            font-size: 18px;
            font-weight: 700;
        }

        /* Camera */
        .camera-container {
            text-align: center;
            padding: 20px;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .camera-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .camera-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: var(--radius-sm);
            margin: 10px 0;
            box-shadow: var(--shadow);
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(0, 255, 136, 0.3);
            margin: 2px;
            animation: badgePop 0.3s;
        }

        @keyframes badgePop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* Water Tracker */
        .water-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin: 10px 0;
        }

        .water-cup {
            aspect-ratio: 1;
            border-radius: 10px;
            background: var(--card2);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all var(--transition);
            position: relative;
        }

        .water-cup:hover {
            transform: scale(1.1);
        }

        .water-cup.active {
            background: linear-gradient(135deg, var(--blue), #00a8cc);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        /* Weekly Mission */
        .mission-card {
            background: linear-gradient(145deg, var(--purple), var(--card));
            border: 1px solid var(--purple);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .mission-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2), transparent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* Fire Design */
        .fire-design {
            background: linear-gradient(135deg, var(--danger), var(--warning), var(--gold));
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
            animation: fireGlow 2s infinite alternate;
        }

        @keyframes fireGlow {
            from { box-shadow: 0 0 20px rgba(255, 71, 87, 0.3); }
            to { box-shadow: 0 0 40px rgba(255, 165, 2, 0.5); }
        }

        .flame-animation {
            display: inline-block;
            animation: flame 1s infinite alternate;
            font-size: 40px;
        }

        @keyframes flame {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.2); filter: brightness(1.5); }
        }

        /* Filter */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-chip {
            padding: 10px 18px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 13px;
            font-weight: 600;
        }

        .filter-chip:hover {
            background: var(--border);
        }

        .filter-chip.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty .emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 15px;
        }

        /* Spinner */
        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 9999;
            animation: confettiFall 3s ease-in-out infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app { padding: 15px; }
            header { padding: 10px 15px; margin: -15px -15px 15px -15px; }
            .nav { overflow-x: auto; padding-bottom: 5px; }
            .nav-btn { white-space: nowrap; font-size: 12px; padding: 8px 12px; }
            .timer-display { font-size: 48px; }
            .set-row { grid-template-columns: 50px 1fr 1fr 50px; }
            .stat-card .value { font-size: 28px; }
        }

        @media (max-width: 480px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .card { padding: 15px; }
            .modal { padding: 20px; }
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        .slide-in-right {
            animation: slideInRight 0.5s ease;
        }

        .slide-in-left {
            animation: slideInLeft 0.5s ease;
        }

        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .bounce {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Utility */
        .text-center { text-align: center; }
        .text-accent { color: var(--accent); }
        .text-danger { color: var(--danger); }
        .text-secondary { color: var(--text-secondary); }

                state.weeklyMission = {

                    weekStart: weekStart,
                    progress: 0,
                    completed: false
                };
                saveState();
            }
            return state.weeklyMission;

            const today = new Date();
            const day = today.getDay();
            const diff = today.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(today.setDate(diff)).toISOString().split('T')[0];

        function generate30DayProgram(mode) {
            const program = [];
            const homeWorkouts = ['push_up', 'bodyweight_squat', 'plank', 'lunges', 'jumping_jacks'];
            const gymWorkouts = ['barbell_bench_press', 'squat', 'deadlift', 'overhead_press', 'dumbbell_row'];
            
            for (let day = 1; day <= 30; day++) {
                const dayPlan = {
                    day: day,
                    exercises: []
                };
                
                if (mode === 'home') {
                    dayPlan.exercises = [
                        { exerciseId: 'push_up', sets: 3, reps: 15, rest: 45, completedSets: [], currentSet: 0 },
                        { exerciseId: 'bodyweight_squat', sets: 3, reps: 20, rest: 45, completedSets: [], currentSet: 0 },
                        { exerciseId: 'lunges', sets: 3, reps: 12, rest: 60, completedSets: [], currentSet: 0 },
                        { exerciseId: 'plank', sets: 3, reps: 30, rest: 30, completedSets: [], currentSet: 0 }
                    ];
                } else {
                    dayPlan.exercises = [
                        { exerciseId: 'barbell_bench_press', sets: 4, reps: 8, rest: 90, completedSets: [], currentSet: 0 },
                        { exerciseId: 'squat', sets: 4, reps: 8, rest: 120, completedSets: [], currentSet: 0 },
                        { exerciseId: 'deadlift', sets: 3, reps: 5, rest: 180, completedSets: [], currentSet: 0 },
                        { exerciseId: 'overhead_press', sets: 3, reps: 10, rest: 90, completedSets: [], currentSet: 0 }
                    ];
                }
                
                if (day % 7 === 0) {
                    dayPlan.exercises = [
                        { exerciseId: 'plank', sets: 2, reps: 45, rest: 30, completedSets: [], currentSet: 0 },
                        { exerciseId: mode === 'home' ? 'lunges' : 'squat', sets: 2, reps: 10, rest: 60, completedSets: [], currentSet: 0 }
                    ];
                }
                
                program.push(dayPlan);
            }
            return program;
        }
        
        function renderActiveWorkout(container) {
            const workout = state.currentWorkout;
            if (!workout) return;
            
            const currentExercise = workout.exercises[state.activeExerciseIndex];
            const exerciseData = exercises[currentExercise.exerciseId];
            
            container.innerHTML = `

                                    <input type="number" id="reps-${i}" value="${currentExercise.reps}" min="1" placeholder="التكرارات">
                                    <button class="check-btn ${i < currentExercise.completedSets.length ? 'done' : ''}" onclick="completeSet(${i})">

                    </div>
                </div>
            `;
        }
        
        function completeSet(setIndex) {
            const workout = state.currentWorkout;
            if (!workout) return;
            
            const currentExercise = workout.exercises[state.activeExerciseIndex];
            
            if (setIndex < currentExercise.completedSets.length) {
                showToast('هذه المجموعة مكتملة');
                return;
            }
            
            const weightInput = document.getElementById(`weight-${setIndex}`);
            const repsInput = document.getElementById(`reps-${setIndex}`);
            
            if (!weightInput || !repsInput) return;
            
            const weight = parseFloat(weightInput.value) || 0;
            const reps = parseInt(repsInput.value) || 0;
            
            currentExercise.completedSets.push({ weight, reps });
            currentExercise.currentSet = setIndex + 1;
            
            // Update stats
            state.stats.totalSets++;
            state.stats.totalReps += reps;
            state.stats.totalVolume += weight * reps;
            state.stats.totalCalories += exercises[currentExercise.exerciseId].calories_per_set;
            
            // Add XP
            addXP(5);
            
            // Update mission
            updateMissionProgress(weight * reps);
            
            // Check for PR            const exerciseKey = currentExercise.exerciseId;
            if (!state.personalRecords[exerciseKey] || weight > state.personalRecords[exerciseKey].weight) {
                state.personalRecords[exerciseKey] = { weight, reps };
                if (state.personalRecords[exerciseKey].weight > 0) {
                    showToast('🎉 رقم قياسي جديد!');
                    updateMissionProgress(1);
                }
            }
            
            // Update exercise history
            if (!state.exerciseHistory[exerciseKey]) {
                state.exerciseHistory[exerciseKey] = [];
            }
            state.exerciseHistory[exerciseKey].push({
                date: new Date().toISOString(),
                weight,
                reps,
                volume: weight * reps
            });
            
            saveState();
            renderActiveWorkout(document.getElementById('main-content'));
            
            // Start rest timer
            startRestTimer(currentExercise.rest);
        }
        
        let restTimer = null;
        let restTimeRemaining = 0;
        
        function startRestTimer(duration) {
            if (restTimer) clearInterval(restTimer);
            restTimeRemaining = duration;
            
            // Show rest modal with video
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'rest-modal';
            modal.innerHTML = `
                <div class="modal text-center">
                    <h2>⏱️ وقت الراحة</h2>
                    <div class="timer-display" id="rest-timer">${restTimeRemaining}</div>
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/UBMk30rjy0o" allowfullscreen></iframe>
                    </div>
                    <div class="flex gap-1 justify-center mt-2">
                        <button class="btn btn-sm" onclick="adjustRestTimer(-30)">-30s</button>
                        <button class="btn btn-sm" onclick="adjustRestTimer(30)">+30s</button>
                        <button class="btn btn-primary" onclick="skipRest()">تخطي الراحة</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').appendChild(modal);
            
            // Start countdown
            restTimer = setInterval(() => {
                restTimeRemaining--;
                const display = document.getElementById('rest-timer');
                if (display) {
                    display.textContent = restTimeRemaining;
                }
                if (restTimeRemaining <= 0) {
                    clearInterval(restTimer);
                    closeRestModal();
                }
            }, 1000);
        }
        
        function adjustRestTimer(seconds) {
            restTimeRemaining += seconds;
            const display = document.getElementById('rest-timer');
            if (display) display.textContent = restTimeRemaining;
        }
        
        function skipRest() {
            clearInterval(restTimer);
            closeRestModal();
        }
        
        function closeRestModal() {
            const modal = document.getElementById('rest-modal');
            if (modal) modal.remove();
            // Move to next set or exercise
            const currentExercise = state.currentWorkout.exercises[state.activeExerciseIndex];
            if (currentExercise.currentSet >= currentExercise.sets) {
                // Move to next exercise
                if (state.activeExerciseIndex < state.currentWorkout.exercises.length - 1) {
                    state.activeExerciseIndex++;
                    saveState();
                    renderActiveWorkout(document.getElementById('main-content'));
                    showToast('التمرين التالي! 💪');
                } else {
                    finishWorkout();
                }
            } else {
                renderActiveWorkout(document.getElementById('main-content'));
            }
        }
        
        function skipExercise() {
            if (state.activeExerciseIndex < state.currentWorkout.exercises.length - 1) {
                state.activeExerciseIndex++;
                saveState();
                renderPage();
                showToast('انتقل للتمرين التالي');
            } else {
                finishWorkout();
            }
        }
        
        function finishWorkout() {
            const workout = state.currentWorkout;
            if (!workout) return;
            
            const durationMinutes = Math.round((new Date() - new Date(workout.startTime)) / 60000);
            const calories = state.stats.totalCalories;
            
            state.stats.totalWorkouts++;
            state.stats.totalDuration += durationMinutes * 60;
            
            // Streak update
            const today = new Date().toISOString().split('T')[0];
            if (state.stats.lastWorkoutDate !== today) {
                state.stats.currentStreak++;
                state.stats.longestStreak = Math.max(state.stats.longestStreak, state.stats.currentStreak);
                state.stats.lastWorkoutDate = today;
            }
            
            // Save workout history
            state.workoutHistory.push({
                date: new Date().toISOString(),
                duration: durationMinutes,
                exercises: workout.exercises.length,
                sets: state.stats.totalSets,
                volume: state.stats.totalVolume,
                calories: calories
            });
            
            // Complete work
            state.currentWorkout = null;
            state.activeExerciseIndex = 0;
            saveState();
            
            // Show completion
            showToast(`اكتمل التمرين! 🔥 ${calories} سعرة حرارية`);
            addXP(50);
            
            // Fire design animation
            launchConfetti();
            
            renderPage();
        }

                            `).join('')}
                        </div>
                    ` : ''}
                    
                    <button class="btn btn-primary btn-block mt-2" onclick="addToTodayWorkout('${exerciseId}')">إضافة لتمرين اليوم</button>
                </div>
            `;
            document.getElementById('modal-container').appendChild(modal);
        }
        
        function addToTodayWorkout(exerciseId) {
            if (!state.currentWorkout) {
                state.currentWorkout = {
                    startTime: new Date().toISOString(),
                    exercises: [],
                    completed: false
                };
            }
            
            const exercise = exercises[exerciseId];
            state.currentWorkout.exercises.push({
                exerciseId: exerciseId,
                sets: exercise.sets,
                reps: exercise.reps,
                rest: exercise.rest,
                completedSets: [],
                currentSet: 0
            });
            
            saveState();
            closeModal();
            showToast('تمت الإضافة للتمرين ✅');
            showPage('workout');
        }
        
        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }
        
        // ==================== FOOD PAGE ====================
        function renderFoodPage(container) {
            const todayMeals = state.meals.filter(meal => meal.date === new Date().toISOString().split('T')[0]);
            const totalCalories = todayMeals.reduce((sum, meal) => sum + meal.calories, 0);
            const totalProtein = todayMeals.reduce((sum, meal) => sum + meal.protein, 0);
            const totalCarbs = todayMeals.reduce((sum, meal) => sum + meal.carbs, 0);
            
            container.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-center mb-2">🥗 التغذية الذكية</h2>
                    
                    <!-- Stats -->
                    <div class="grid grid-3">
                        <div class="card stat-card">
                            <div class="emoji">🔥</div>
                            <div class="value">${totalCalories}</div>
                            <div class="label">سعرة حرارية</div>
                        </div>
                        <div class="card stat-card">
                            <div class="emoji">🥩</div>
                            <div class="value">${totalProtein}g</div>
                            <div class="label">بروتين</div>
                        </div>
                        <div class="card stat-card">
                            <div class="emoji">🍞</div>
                            <div class="value">${totalCarbs}g</div>
                            <div class="label">كربوهيدرات</div>
                        </div>
                    </div>
                    
                    <!-- Camera Analysis -->
                    <div class="card mt-2">
                        <h3>📷 تحليل الوجبات بالكاميرا</h3>
                        <div class="camera-container">
                            <input type="file" accept="image/*" onchange="analyzeFoodImage(this)" class="hidden" id="camera-input">
                            <button class="btn btn-blue btn-lg" onclick="document.getElementById('camera-input').click()">
                                📸 تصوير وجبة
                            </button>
                            <div id="camera-result"></div>
                        </div>
                    </div>
                    
                    <!-- Quick Add -->
                    <div class="card mt-2">
                        <h3>⚡ إضافة سريعة</h3>
                        <div class="form-group">
                            <label>اسم الوجبة</label>
                            <input type="text" id="meal-name" placeholder="مثال: صدر دجاج مع أرز">
                        </div>
                        <div class="grid grid-2">
                            <div class="form-group">
                                <label>السعرات</label>
                                <input type="number" id="meal-calories" placeholder="300">
                            </div>
                            <div class="form-group">
                                <label>البروتين (g)</label>
                                <input type="number" id="meal-protein" placeholder="25">
                            </div>
                        </div>
                        <div class="grid grid-2">
                            <div class="form-group">
                                <label>الكارب (g)</label>
                                <input type="number" id="meal-carbs" placeholder="30">
                            </div>
                            <div class="form-group">
                                <label>الدهون (g)</label>
                                <input type="number" id="meal-fat" placeholder="10">
                            </div>
                        </div>
                        <button class="btn btn-primary btn-block" onclick="addMeal()">إضافة الوجبة</button>
                    </div>
                    
                    <!-- Today's Meals -->
                    <div class="card mt-2">
                        <h3>📋 وجبات اليوم</h3>
                        ${todayMeals.length > 0 ? `
                            ${todayMeals.map(meal => `
                                <div class="flex justify-between items-center" style="padding: 10px 0; border-bottom: 1px solid var(--border);">
                                    <div>
                                        <strong>${meal.name}</strong>
                                        <div class="text-secondary">${meal.time}</div>
                                    </div>
                                    <div class="text-center">
                                        <div>${meal.calories} سعرة</div>
                                        <div class="text-secondary">${meal.protein}g بروتين</div>
                                    </div>
                                    <button class="btn btn-danger btn-sm" onclick="deleteMeal(${meal.id})">×</button>
                                </div>
                            `).join('')}
                        ` : `
                            <div class="empty">
                                <div class="emoji">🍽️</div>
                                <p>لا وجبات مسجلة اليوم</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }
        
        function analyzeFoodImage(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const resultDiv = document.getElementById('camera-result');
                const imageData = e.target.result;
                const estimatedCalories = estimateMealCalories(imageData);
                
                resultDiv.innerHTML = `
                    <div class="card mt-2" style="border-color: var(--accent);">
                        <img src="${imageData}" class="camera-preview" alt="meal">
                        <h4>التحليل التقديري:</h4>
                        <div class="grid grid-3">
                            <div class="stat-card">
                                <div class="value">${estimatedCalories}</div>
                                <div class="label">سعرة</div>
                            </div>
                            <div class="stat-card">
                                <div class="value">${Math.round(estimatedCalories * 0.25)}g</div>
                                <div class="label">بروتين</div>
                            </div>
                            <div class="stat-card">
                                <div class="value">${Math.round(estimatedCalories * 0.4)}g</div>
                                <div class="label">كارب</div>
                            </div>
                        </div>
                        <div class="flex gap-1 mt-2">
                            <input type="text" id="camera-meal-name" placeholder="اسم الوجبة" value="وجبة مصورة">
                            <button class="btn btn-primary" onclick="addAnalyzedMeal('${estimatedCalories}')">إضافة</button>
                        </div>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        }
        
        function estimateMealCalories(imageData) {
            // Mock function - in real app this would use AI
            const baseCalories = 300;
            const variety = Math.random() * 200;
            return Math.round(baseCalories + variety);
        }
        
        function addAnalyzedMeal(calories) {
            const name = document.getElementById('camera-meal-name').value;
            if (!name) return;
            
            state.meals.push({
                id: Date.now(),
                name: name,
                calories: parseInt(calories),
                protein: Math.round(calories * 0.25),
                carbs: Math.round(calories * 0.4),
                fat: Math.round(calories * 0.2),
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })
            });
            
            saveState();
            renderPage();
            showToast('تمت إضافة الوجبة ✅');
        }
        
        function addMeal() {
            const name = document.getElementById('meal-name').value;
            const calories = parseInt(document.getElementById('meal-calories').value) || 0;
            const protein = parseInt(document.getElementById('meal-protein').value) || 0;
            const carbs = parseInt(document.getElementById('meal-carbs').value) || 0;
            const fat = parseInt(document.getElementById('meal-fat').value) || 0;
            
            if (!name) {
                showToast('أدخل اسم الوجبة');
                return;
            }
            
            state.meals.push({
                id: Date.now(),
                name: name,
                calories: calories,
                protein: protein,
                carbs: carbs,
                fat: fat,
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })
            });
            
            saveState();
            renderPage();
            showToast('تمت إضافة الوجبة ✅');
        }
        
        function deleteMeal(id) {
            state.meals = state.meals.filter(meal => meal.id !== id);
            saveState();
            renderPage();
            showToast('تم حذف الوجبة');
        }
        
        // ==================== MISSIONS PAGE ====================
        function renderMissionsPage(container) {
            const weeklyMission = getWeeklyMission();
            const completedMissions = state.completedMissions;
            
            container.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-center mb-2">⚡ المهمات الأسبوعية</h2>
                    
                    <!-- Current Mission -->
                    <div class="mission-card">
                        <h3>${weeklyMission.icon} ${weeklyMission.title}</h3>
                        <p class="text-secondary">${weeklyMission.description}</p>
                        <div class="flex justify-between mt-2">
                            <span class="text-gold">المكافأة: ${weeklyMission.reward} XP</span>
                            <span>${weeklyMission.progress}/${weeklyMission.target}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="fill" style="width: ${Math.min(100, (weeklyMission.progress / weeklyMission.target) * 100)}%"></div>
                        </div>
                        ${weeklyMission.completed ? `
                            <div class="text-center mt-2">
                                <span class="badge">✅ مكتملة</span>
                            </div>
                        ` : ''}
                    </div>
                    
                    <!-- All Missions -->
                    <h3 class="mt-3 mb-2">جميع المهمات</h3>
                    <div class="grid grid-2">
                        ${weeklyMissions.map(mission => {
                            const isCompleted = completedMissions.includes(mission.id) || (weeklyMission.id === mission.id && weeklyMission.completed);
                            return `
                                <div class="card ${isCompleted ? 'border-accent' : ''}">
                                    <h3>${mission.icon} ${mission.title}</h3>
                                    <p class="text-secondary">${mission.description}</p>
                                    <div class="flex justify-between mt-2">
                                        <span class="text-gold">${mission.reward} XP</span>
                                        ${isCompleted ? '<span class="badge">✅ مكتملة</span>' : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }
        
        // ==================== PROGRESS PAGE ====================
        function renderProgressPage(container) {
            const workouts = state.workoutHistory;
            const recentWorkouts = workouts.slice(-7);
            const maxVolume = Math.max(...recentWorkouts.map(w => w.volume), 1);
            
            container.innerHTML = `
                <div class="fade-in">
                    <h2 class="text-center mb-2">📊 تقدمك</h2>
                    
                    <!-- Fire Design Stats -->
                    <div class="fire-design mb-2">
                        <h3>🔥 مستواك الناري</h3>
                        <div class="grid grid-3">
                            <div class="text-center">
                                <span class="flame-animation">🔥</span>
                                <div>${state.stats.currentStreak} يوم</div>
                            </div>
                            <div class="text-center">
                                <span class="flame-animation" style="animation-delay: 0.2s;">🏆</span>
                                <div>${state.stats.longestStreak} أطول</div>
                            </div>
                            <div class="text-center">
                                <span class="flame-animation" style="animation-delay: 0.4s;">⚡</span>
                                <div>${state.level} مستوى</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Body Weight -->
                    <div class="card">
                        <h3>⚖️ وزن الجسم</h3>
                        <div class="flex gap-1 mb-2">
                            <input type="number" id="body-weight-input" placeholder="الوزن (كجم)" step="0.1">
                            <button class="btn btn-primary" onclick="addBodyWeight()">تسجيل</button>
                        </div>
                        ${state.bodyWeight.length > 0 ? `
                            <div style="height: 150px; display: flex; align-items: flex-end; gap: 5px; margin-top: 10px;">
                                ${state.bodyWeight.slice(-7).map(w => `
                                    <div style="flex: 1; background: linear-gradient(180deg, var(--accent), var(--blue)); border-radius: 4px 4px 0 0; height: ${Math.min(100, (w.weight / 100) * 100)}%; position: relative;">
                                        <span style="position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 10px;">${w.weight}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p class="text-secondary">لا توجد بيانات</p>'}
                    </div>
                    
                    <!-- Workout Volume -->
                    <div class="card mt-2">
                        <h3>📈 حجم التمرين</h3>
                        <div style="height: 150px; display: flex; align-items: flex-end; gap: 5px; margin-top: 10px;">
                            ${recentWorkouts.length > 0 ? recentWorkouts.map(w => `
                                <div style="flex: 1; background: linear-gradient(180deg, var(--purple), var(--pink)); border-radius: 4px 4px 0 0; height: ${Math.min(100, (w.volume / maxVolume) * 100)}%; position: relative;">
                                    <span style="position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 10px;">${w.volume}</span>
                                </div>
                            `).join('') : '<div class="empty">لا توجد بيانات</div>'}
                        </div>
                    </div>
                    
                    <!-- Achievements -->
                    <div class="card mt-2">
                        <h3>🏆 الإنجازات</h3>
                        <div class="grid grid-3">
                            <div class="card stat-card">
                                <div class="emoji">🔥</div>
                                <div class="value">${state.stats.currentStreak}</div>
                                <div class="label">السلسلة الحالية</div>
                            </div>
                            <div class="card stat-card">
                                <div class="emoji">🏆</div>
                                <div class="value">${state.stats.longestStreak}</div>
                                <div class="label">أطول سلسلة</div>
                            </div>
                            <div class="card stat-card">
                                <div class="emoji">💪</div>
                                <div class="value">${state.stats.totalWorkouts}</div>
                                <div class="label">إجمالي التمارين</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Personal Records -->
                    <div class="card mt-2">
                        <h3>🏆 الأرقام القياسية</h3>
                        ${Object.keys(state.personalRecords).length > 0 ? `
                            ${Object.entries(state.personalRecords).map(([id, pr]) => {
                                const exercise = exercises[id];
                                return exercise ? `
                                    <div class="flex justify-between items-center" style="padding: 10px 0; border-bottom: 1px solid var(--border);">
                                        <span>${exercise.name}</span>
                                        <span class="text-gold">${pr.weight} ${state.settings.units} × ${pr.reps}</span>
                                    </div>
                                ` : '';
                            }).join('')}
                        ` : '<p class="text-secondary">لا توجد أرقام قياسية بعد</p>'}
                    </div>
                </div>
            `;
        }
        
        function addBodyWeight() {
            const weight = parseFloat(document.getElementById('body-weight-input').value);
            if (!weight) return;
            
            state.bodyWeight.push({
                date: new Date().toISOString().split('T')[0],
                weight: weight
            });
            
            saveState();
            renderPage();
            showToast('تم تسجيل الوزن ✅');
        }
        
        // ==================== TOAST ====================
        function showToast(message, type = '') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // ==================== INITIALIZATION ====================
        function init() {
            if (!state.profile) {
                renderProfileSetup(document.getElementById('main-content'));
            } else {
                renderPage();
            }
            
            // Add keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
