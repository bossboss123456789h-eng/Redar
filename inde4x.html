                <div class="badge-grid">
                    ${badges.map(badge => {
                        const unlocked = appState.badges[badge.id];
                        return `
                            <div class="badge-item ${unlocked ? 'unlocked' : 'locked'}">
                                <span class="icon">${badge.icon}</span>
                                <div class="name">${t(badge.nameKey) || badge.name}</div>
                                ${unlocked ? `<div class="text-accent mt-1">✓ ${new Date(unlocked).toLocaleDateString()}</div>` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function getBadgeDefinitions() {
            return [
                { id: 'first_workout', name: 'First Workout', nameKey: 'first_workout', icon: '🏅', requirement: 'Complete your first workout' },
                { id: 'first_set', name: 'First Set', nameKey: 'first_set', icon: '💪', requirement: 'Complete your first set' },
                { id: 'first_pr', name: 'First PR', nameKey: 'first_pr', icon: '🏆', requirement: 'Set a personal record' },
                { id: 'streak_3', name: '3 Day Streak', nameKey: 'streak_3', icon: '🔥', requirement: '3 day streak' },
                { id: 'streak_7', name: '7 Day Streak', nameKey: 'streak_7', icon: '🔥', requirement: '7 day streak' },
                { id: 'streak_14', name: '14 Day Streak', nameKey: 'streak_14', icon: '🔥', requirement: '14 day streak' },
                { id: 'streak_30', name: '30 Day Streak', nameKey: 'streak_30', icon: '🔥', requirement: '30 day streak' },
                { id: 'days_7', name: '7 Days Complete', nameKey: 'days_complete_7', icon: '📅', requirement: 'Complete 7 days' },
                { id: 'days_15', name: '15 Days Complete', nameKey: 'days_complete_15', icon: '📅', requirement: 'Complete 15 days' },
                { id: 'days_30', name: '30 Days Complete', nameKey: 'days_complete_30', icon: '🏆', requirement: 'Complete 30 days' },
                { id: 'first_cycle', name: 'First Cycle', nameKey: 'first_cycle', icon: '🔄', requirement: 'Complete first cycle' },
                { id: 'cycles_3', name: '3 Cycles', nameKey: 'cycles_3', icon: '🔄', requirement: 'Complete 3 cycles' },
                { id: 'workouts_100', name: '100 Workouts', nameKey: 'workouts_100', icon: '💯', requirement: 'Complete 100 workouts' },
                { id: 'exercises_50', name: '50 Exercises', nameKey: 'exercises_50', icon: '📚', requirement: 'Explore 50 exercises' },
                { id: 'exercises_100', name: '100 Exercises', nameKey: 'exercises_100', icon: '📚', requirement: 'Explore 100 exercises' }
            ];
        }

        function unlockBadge(badgeId) {
            if (!appState.badges[badgeId]) {
                appState.badges[badgeId] = new Date().toISOString();
            }
        }

        function unlockBadges() {
            // First workout
            if (appState.stats.totalWorkouts >= 1) unlockBadge('first_workout');
            if (appState.stats.totalSets >= 1) unlockBadge('first_set');
            
            // Streaks
            if (appState.stats.currentStreak >= 3) unlockBadge('streak_3');
            if (appState.stats.currentStreak >= 7) unlockBadge('streak_7');
            if (appState.stats.currentStreak >= 14) unlockBadge('streak_14');
            if (appState.stats.currentStreak >= 30) unlockBadge('streak_30');
            
            // Days
            const completedDays = Object.keys(appState.completedDays).length;
            if (completedDays >= 7) unlockBadge('days_7');
            if (completedDays >= 15) unlockBadge('days_15');
            if (completedDays >= 30) unlockBadge('days_30');
            
            // Cycles
            if (appState.currentCycle >= 2) unlockBadge('first_cycle');
            if (appState.currentCycle >= 4) unlockBadge('cycles_3');
            
            // Workouts
            if (appState.stats.totalWorkouts >= 100) unlockBadge('workouts_100');
            
            // Exercises explored
            const exploredExercises = Object.keys(appState.exerciseHistory).length;
            if (exploredExercises >= 50) unlockBadge('exercises_50');
            if (exploredExercises >= 100) unlockBadge('exercises_100');
        }

        // ==================== CHALLENGES ====================
        function renderChallenges(container) {
            const challenges = [
                { id: 'challenge_7', name: '7 Day Challenge', nameKey: 'challenge_7', icon: '⚡', requirement: 'Complete 7 consecutive days', progress: appState.stats.currentStreak, target: 7 },
                { id: 'challenge_14', name: '14 Day Challenge', nameKey: 'challenge_14', icon: '🔥', requirement: 'Complete 14 consecutive days', progress: appState.stats.currentStreak, target: 14 },
                { id: 'challenge_30', name: '30 Day Challenge', nameKey: 'challenge_30', icon: '🏆', requirement: 'Complete 30 consecutive days', progress: appState.stats.currentStreak, target: 30 },
                { id: 'challenge_100', name: '100 Workout Challenge', nameKey: 'challenge_100', icon: '💯', requirement: 'Complete 100 workouts', progress: appState.stats.totalWorkouts, target: 100 },
                { id: 'consistency', name: 'Consistency Challenge', nameKey: 'consistency_challenge', icon: '📅', requirement: 'Complete 20 workouts', progress: appState.stats.totalWorkouts, target: 20 }
            ];
            
            container.innerHTML = `
                <h1 class="mb-2">${t('challenges')}</h1>
                ${challenges.map(challenge => {
                    const progress = Math.min(100, (challenge.progress / challenge.target) * 100);
                    const completed = challenge.progress >= challenge.target;
                    return `
                        <div class="card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <span class="icon">${challenge.icon}</span>
                                    <h3>${t(challenge.nameKey)}</h3>
                                    <p class="text-secondary">${challenge.requirement}</p>
                                </div>
                                <div class="text-center">
                                    <div class="value">${challenge.progress}/${challenge.target}</div>
                                    ${completed ? '<span class="text-accent">✓</span>' : ''}
                                </div>
                            </div>
                            <div class="progress-bar mt-1">
                                <div class="fill" style="width: ${progress}%"></div>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
        }

        // ==================== STATISTICS ====================
        function renderStatistics(container) {
            container.innerHTML = `
                <h1 class="mb-2">${t('statistics')}</h1>
                
                <div class="grid">
                    <div class="card stat-card">
                        <div class="value">${appState.stats.totalWorkouts}</div>
                        <div class="label">${t('workouts')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">${appState.stats.totalSets}</div>
                        <div class="label">${t('total_sets')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">${appState.stats.totalReps}</div>
                        <div class="label">${t('total_reps')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">${appState.stats.totalVolume}</div>
                        <div class="label">${t('total_volume')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">~${appState.stats.totalCalories}</div>
                        <div class="label">${t('calories_burned')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">${Math.round(appState.stats.totalDuration / 3600)}h</div>
                        <div class="label">${t('training_time')}</div>
                    </div>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('volume_progress')}</h3>
                    <div class="bar-chart">
                        ${appState.workoutHistory.slice(-10).map(w => `
                            <div class="bar" style="height: ${Math.min(100, (w.totalVolume / 1000) * 50)}%" title="${w.totalVolume}"></div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('weight_progress')}</h3>
                    ${appState.bodyWeight.length > 0 ? `
                        <div class="bar-chart">
                            ${appState.bodyWeight.slice(-10).map(w => `
                                <div class="bar" style="height: ${Math.min(100, (w.weight / 100) * 50)}%" title="${w.weight}kg"></div>
                            `).join('')}
                        </div>
                        <p class="text-secondary text-center mt-1">
                            ${t('starting_weight')}: ${appState.bodyWeight[0].weight}kg → ${t('current_weight')}: ${appState.bodyWeight[appState.bodyWeight.length - 1].weight}kg
                        </p>
                    ` : `<p class="text-secondary">${t('no_data')}</p>`}
                </div>
            `;
        }

        // ==================== PROGRESS ====================
        function renderProgress(container) {
            container.innerHTML = `
                <h1 class="mb-2">${t('progress')}</h1>
                
                <div class="card">
                    <h3>${t('body_weight')}</h3>
                    <div class="flex gap-1 mb-2">
                        <input type="date" id="weight-date" value="${new Date().toISOString().split('T')[0]}">
                        <input type="number" id="weight-input" placeholder="${t('weight_kg')}" step="0.1">
                        <button class="btn btn-primary" onclick="addBodyWeight()">${t('save')}</button>
                    </div>
                    ${appState.bodyWeight.length > 0 ? `
                        <div class="mt-2">
                            ${appState.bodyWeight.slice(-10).reverse().map(w => `
                                <div class="flex justify-between" style="padding: 5px 0; border-bottom: 1px solid var(--border);">
                                    <span>${w.date}</span>
                                    <strong>${w.weight} kg</strong>
                                </div>
                            `).join('')}
                        </div>
                    ` : `<p class="text-secondary">${t('no_data')}</p>`}
                </div>
                
                <div class="card mt-2">
                    <h3>${t('body_measurements')}</h3>
                    <div class="form-group">
                        <label>${t('waist')} (cm)</label>
                        <input type="number" id="measurement-waist" placeholder="${t('waist')}">
                    </div>
                    <div class="form-group">
                        <label>${t('chest')} (cm)</label>
                        <input type="number" id="measurement-chest" placeholder="${t('chest')}">
                    </div>
                    <button class="btn btn-primary" onclick="addMeasurements()">${t('save')}</button>
                    
                    ${appState.measurements.length > 0 ? `
                        <div class="mt-2">
                            ${appState.measurements.slice(-5).reverse().map(m => `
                                <div class="flex justify-between" style="padding: 5px 0; border-bottom: 1px solid var(--border);">
                                    <span>${m.date}</span>
                                    <span>${m.waist ? 'Waist: ' + m.waist : ''} ${m.chest ? 'Chest: ' + m.chest : ''}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function addBodyWeight() {
            const date = document.getElementById('weight-date').value;
            const weight = parseFloat(document.getElementById('weight-input').value);
            if (!date || !weight || weight <= 0) return;
            
            appState.bodyWeight.push({ date, weight });
            saveState(appState);
            renderApp();
            showToast(t('data_saved'));
        }

        function addMeasurements() {
            const waist = parseFloat(document.getElementById('measurement-waist').value) || null;
            const chest = parseFloat(document.getElementById('measurement-chest').value) || null;
            
            if (!waist && !chest) return;
            
            appState.measurements.push({
                date: new Date().toISOString().split('T')[0],
                waist,
                chest
            });
            saveState(appState);
            renderApp();
            showToast(t('data_saved'));
        }

        // ==================== PROFILE ====================
        function renderProfile(container) {
            if (!appState.profile) {
                renderProfileSetup(container);
                return;
            }
            
            container.innerHTML = `
                <h1 class="mb-2">${t('profile')}</h1>
                
                <div class="card text-center">
                    <div style="font-size: 64px;">👤</div>
                    <h2>${appState.profile.name}</h2>
                    <p class="text-secondary">${t('level')} ${appState.stats.level} • ${appState.stats.totalXP} XP</p>
                    <div class="progress-bar mt-1">
                        <div class="fill" style="width: ${(appState.stats.totalXP % 100)}%"></div>
                    </div>
                </div>
                
                <div class="grid mt-2">
                    <div class="card stat-card">
                        <div class="value">🔥 ${appState.stats.currentStreak}</div>
                        <div class="label">${t('current_streak')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">🏆 ${appState.stats.longestStreak}</div>
                        <div class="label">${t('longest_streak')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">💪 ${appState.stats.totalWorkouts}</div>
                        <div class="label">${t('workouts')}</div>
                    </div>
                    <div class="card stat-card">
                        <div class="value">🔄 ${appState.currentCycle}</div>
                        <div class="label">${t('cycle')}</div>
                    </div>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('profile')}</h3>
                    <div class="flex justify-between mt-1">
                        <span>${t('age')}:</span>
                        <strong>${appState.profile.age}</strong>
                    </div>
                    <div class="flex justify-between">
                        <span>${t('height')}:</span>
                        <strong>${appState.profile.height} cm</strong>
                    </div>
                    <div class="flex justify-between">
                        <span>${t('weight_kg')}:</span>
                        <strong>${appState.profile.weight} kg</strong>
                    </div>
                    <div class="flex justify-between">
                        <span>${t('training_goal')}:</span>
                        <strong>${t('goals.' + appState.profile.goal)}</strong>
                    </div>
                    <div class="flex justify-between">
                        <span>${t('experience')}:</span>
                        <strong>${t('levels.' + appState.profile.experience)}</strong>
                    </div>
                </div>
            `;
        }

        // ==================== SETTINGS ====================
        function renderSettings(container) {
            container.innerHTML = `
                <h1 class="mb-2">${t('settings')}</h1>
                
                <div class="card">
                    <h3>${t('language')}</h3>
                    <div class="flex gap-1 mt-1">
                        <button class="btn ${appState.settings.language === 'ar' ? 'btn-primary' : 'btn-secondary'}" onclick="setLanguage('ar')">العربية</button>
                        <button class="btn ${appState.settings.language === 'en' ? 'btn-primary' : 'btn-secondary'}" onclick="setLanguage('en')">English</button>
                    </div>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('theme')}</h3>
                    <div class="flex gap-1 mt-1">
                        <button class="btn ${appState.settings.theme === 'dark' ? 'btn-primary' : 'btn-secondary'}" onclick="setTheme('dark')">${t('dark_mode')}</button>
                        <button class="btn ${appState.settings.theme === 'light' ? 'btn-primary' : 'btn-secondary'}" onclick="setTheme('light')">${t('light_mode')}</button>
                    </div>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('units')}</h3>
                    <div class="flex gap-1 mt-1">
                        <button class="btn ${appState.settings.units === 'kg' ? 'btn-primary' : 'btn-secondary'}" onclick="setUnits('kg')">${t('kg')}</button>
                        <button class="btn ${appState.settings.units === 'lb' ? 'btn-primary' : 'btn-secondary'}" onclick="setUnits('lb')">${t('lb')}</button>
                    </div>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('data_management')}</h3>
                    <div class="flex gap-1 flex-wrap mt-1">
                        <button class="btn btn-secondary" onclick="exportData()">${t('export')}</button>
                        <button class="btn btn-secondary" onclick="importData()">${t('import')}</button>
                    </div>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('danger_zone')}</h3>
                    <button class="btn btn-danger mt-1" onclick="deleteAllData()">${t('delete_local_data')}</button>
                </div>
                
                <div class="card mt-2">
                    <h3>${t('about') || 'About'}</h3>
                    <p class="text-secondary">فهد سنك | FAHAD SYNC FITNESS</p>
                    <p class="text-secondary">v1.0.0</p>
                    <p class="text-secondary">${t('tagline')}</p>
                </div>
            `;
        }

        function setLanguage(lang) {
            appState.settings.language = lang;
            saveState(appState);
            renderApp();
        }

        function setTheme(theme) {
            appState.settings.theme = theme;
            saveState(appState);
            renderApp();
        }

        function setUnits(units) {
            appState.settings.units = units;
            saveState(appState);
            renderApp();
        }

        // ==================== DATA MANAGEMENT ====================
        function exportData() {
            const dataStr = JSON.stringify(appState, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `fahad-sync-fitness-data-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(t('export_success'));
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.profile || data.currentDay || data.program) {
                            appState = { ...defaultState, ...data };
                            saveState(appState);
                            renderApp();
                            showToast(t('import_success'));
                        } else {
                            showToast(t('import_error'));
                        }
                    } catch (e) {
                        showToast(t('import_error'));
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function deleteAllData() {
            if (confirm(t('delete_all_data'))) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem('active_workout_session');
                appState = JSON.parse(JSON.stringify(defaultState));
                renderApp();
                showToast(t('data_saved'));
            }
        }

        // ==================== TOAST ====================
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ==================== INITIALIZE ====================
        init();
    </script>
</body>
 </html>
