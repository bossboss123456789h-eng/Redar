<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#18122b">
<title>علي السمحة الزورية - مراحل</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:#0e0a18;color:#fff;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:10px}
.app{width:min(560px,100%);min-height:calc(100vh - 20px);background:linear-gradient(145deg,#211738,#100d1d);border:1px solid #ffffff20;border-radius:28px;padding:16px;box-shadow:0 20px 70px #0009;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:25px;margin:0} .small{opacity:.7;font-size:13px}
.panel{background:#ffffff0b;border:1px solid #ffffff15;border-radius:20px;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stat{background:#0003;border-radius:14px;padding:9px 4px;text-align:center}
.stat b{display:block;font-size:20px;margin-top:3px}
.arena{height:360px;border-radius:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#7149a5,#241839 55%,#100d1d);border:1px solid #ffffff18}
.bubble{position:absolute;top:18px;left:5%;width:90%;background:#fff;color:#21152f;border-radius:18px;padding:12px;font-size:20px;font-weight:900;min-height:54px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 25px #0006}
.character{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:115px;filter:drop-shadow(0 15px 8px #0008);user-select:none}
.character.shout{animation:shake .13s infinite alternate}
.target{position:absolute;border:3px solid #fff;border-radius:50%;width:70px;height:70px;display:none;align-items:center;justify-content:center;font-size:30px;background:#ffffff18;box-shadow:0 0 25px #fff6}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:17px;padding:16px 10px;color:#fff;font-size:18px;font-weight:900;background:linear-gradient(90deg,#ff3d81,#845dff);cursor:pointer}
button.secondary{background:#ffffff12;border:1px solid #ffffff18}
button:active{transform:scale(.97)}
.message{text-align:center;min-height:26px;font-weight:800}
.progress{height:9px;background:#0005;border-radius:20px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:190px;overflow:auto}
.level{padding:10px 4px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff12;color:#fff;font-weight:900}
.level.locked{opacity:.3} .level.current{outline:2px solid #fff}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}
.card{width:min(430px,100%);background:#211738;border:1px solid #ffffff20;border-radius:25px;padding:22px;text-align:center}
.card h2{margin-top:0}
@keyframes shake{from{transform:translateX(-54%) rotate(-3deg)}to{transform:translateX(-46%) rotate(3deg)}}
@keyframes pop{0%{transform:translateX(-50%) scale(.8)}100%{transform:translateX(-50%) scale(1)}}
.pop{animation:pop .25s ease}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1>😎 علي السمحة الزورية</h1><div class="small">نسخة المراحل — العب واصعد المستوى</div></div>
<div>🏆 <b id="coins">0</b></div>
</header>

<div class="panel stats">
<div class="stat">المرحلة<b id="levelNo">1</b></div>
<div class="stat">النقاط<b id="score">0</b></div>
<div class="stat">الهدف<b id="target">10</b></div>
<div class="stat">الوقت<b id="time">28</b></div>
</div>

<div class="arena" id="arena">
<div class="bubble" id="bubble">اضغط «صيّح!» حتى تبدأ المرحلة</div>
<div class="character" id="character">😎</div>
<div class="target" id="targetBtn">🔥</div>
</div>

<div class="panel">
<div class="message" id="message">أكمل الهدف قبل انتهاء الوقت!</div>
<div class="progress"><i id="progress"></i></div>
</div>

<div class="controls">
<button id="shout">📢 صيّح!</button>
<button class="secondary" id="next">➡️ المرحلة التالية</button>
<button class="secondary" id="sound">🔊 الصوت: تشغيل</button>
<button class="secondary" id="reset">♻️ إعادة التقدم</button>
</div>

<div class="panel">
<b>المراحل</b>
<div class="levels" id="levels"></div>
</div>
</div>

<div class="modal" id="modal">
<div class="card">
<h2 id="modalTitle">🔥 أحسنت!</h2>
<p id="modalText"></p>
<button id="modalNext">تابع</button>
</div>
</div>

const DEFAULT_STATE = {
    level: 1,
    unlocked: 1,
    coins: 0,
    bestScore: {},
    sound: true,
    totalShouts: 0
};

let state = loadState();
let score = 0;
let timeLeft = 0;
let timer = null;
let running = false;
let started = false;
let combo = 0;
let lastShout = 0;
let phraseIndex = 0;

const $ = id => document.getElementById(id);

function loadState() {
    try {
        const raw = localStorage.getItem("ali_alsamha_save_v2");
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
            ...structuredClone(DEFAULT_STATE),
            ...parsed,
            bestScore: parsed.bestScore || {}
        };
    } catch (e) {
        return structuredClone(DEFAULT_STATE);
    }
}

function saveState() {
    localStorage.setItem("ali_alsamha_save_v2", JSON.stringify(state));
}

function currentLevel() {
    return LEVELS.find(x => x.id === state.level) || LEVELS[0];
}

function renderLevels() {
    const box = $("levels");
    box.innerHTML = "";
    LEVELS.forEach(level => {
        const b = document.createElement("button");
        b.className = "level";
        b.textContent = level.id;
        if (level.id > state.unlocked) b.classList.add("locked");
        if (level.id === state.level) b.classList.add("current");
        b.disabled = level.id > state.unlocked;
        b.addEventListener("click", () => selectLevel(level.id));
        box.appendChild(b);
    });
}

function selectLevel(id) {
    if (id > state.unlocked) return;
    state.level = id;
    saveState();
    stopTimer();
    resetRound(false);
    updateUI();
}

function updateUI() {
    const lv = currentLevel();
    $("levelNo").textContent = lv.id;
    $("target").textContent = lv.target;
    $("time").textContent = timeLeft || lv.time;
    $("score").textContent = score;
    $("coins").textContent = state.coins;
    $("progress").style.width = Math.min(100, (score / lv.target) * 100) + "%";
    $("sound").textContent = state.sound ? "🔊 الصوت: تشغيل" : "🔇 الصوت: إيقاف";
    renderLevels();
}

function resetRound(showMessage = true) {
    stopTimer();
    const lv = currentLevel();
    score = 0;
    combo = 0;
    phraseIndex = 0;
    timeLeft = lv.time;
    running = false;
    started = false;
    $("bubble").textContent = "اضغط «صيّح!» حتى تبدأ المرحلة";
    $("message").textContent = showMessage ? "جاهز؟" : "أكمل الهدف قبل انتهاء الوقت!";
    $("progress").style.width = "0%";
    updateUI();
}

function startRound() {
    if (running) return;
    running = true;
    started = true;
    const lv = currentLevel();
    timeLeft = lv.time;
    $("message").textContent = "🔥 لا توقف! وصلت للهدف؟";
    timer = setInterval(() => {
        timeLeft--;
        $("time").textContent = timeLeft;
        if (timeLeft <= 0) {
            stopTimer();
            running = false;
            finishRound(false);
        }
    }, 1000);
}

function stopTimer() {
    if (timer) {
        clearInterval(timer);
        timer = null;
    }
}

function choosePhrase() {
    const lv = currentLevel();
    const text = lv.phraseSet[phraseIndex % lv.phraseSet.length];
    phraseIndex++;
    return text;
}

function speak(text) {
    if (!state.sound) return;
    if (!("speechSynthesis" in window)) return;
    try {
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ar-IQ";
        utterance.rate = currentLevel().speed;
        utterance.pitch = 1.05;
        speechSynthesis.speak(utterance);
    } catch (e) {}
}

function shout() {
    if (!started) startRound();
    if (!running) return;

    const now = Date.now();
    if (now - lastShout < 80) return;
    lastShout = now;

    score++;
    combo++;
    state.totalShouts++;

    const lv = currentLevel();
    const text = choosePhrase();

    $("bubble").textContent = text;
    $("score").textContent = score;
    $("progress").style.width = Math.min(100, (score / lv.target) * 100) + "%";
    $("character").classList.remove("shout", "pop");
    void $("character").offsetWidth;
    $("character").classList.add("shout", "pop");

    if (combo >= 10) {
        $("message").textContent = "🔥 كومبو " + combo + "!";
    } else if (combo >= 5) {
        $("message").textContent = "⚡ كومبو " + combo;
    } else {
        $("message").textContent = "😂 علي دا يصيح!";
    }

    speak(text);

    if (score >= lv.target) finishRound(true);
}

function finishRound(won) {
    stopTimer();
    running = false;
    const lv = currentLevel();

    if (won) {
        const bonus = Math.max(5, timeLeft) + combo * 2 + lv.reward;
        state.coins += bonus;
        state.bestScore[lv.id] = Math.max(state.bestScore[lv.id] || 0, score);

        if (lv.id === state.unlocked && lv.id < LEVELS.length) {
            state.unlocked++;
        }

        saveState();
        $("modalTitle").textContent = "🏆 مرحلة مكتملة!";
        $("modalText").textContent =
            "كملت المرحلة " + lv.id + " وحصلت على " + bonus + " 🪙. " +
            (lv.id < LEVELS.length ? "المرحلة التالية انفتحت!" : "خلصت كل المراحل!");
        $("modalNext").textContent = lv.id < LEVELS.length ? "➡️ المرحلة التالية" : "🎉 ممتاز";
        $("modal").classList.add("show");
    } else {
        $("message").textContent = "⏰ خلص الوقت! حاول مرة ثانية.";
        $("bubble").textContent = "يلا علي، حاول أسرع!";
        combo = 0;
    }

    updateUI();
}

function goNext() {
    const next = Math.min(LEVELS.length, state.level + 1);
    if (next <= state.unlocked) {
        state.level = next;
        saveState();
        $("modal").classList.remove("show");
        resetRound(false);
    } else {
        $("modal").classList.remove("show");
    }
}

$("shout").addEventListener("click", shout);
$("shout").addEventListener("touchstart", e => { e.preventDefault(); shout(); }, {passive:false});
$("next").addEventListener("click", () => {
    if (state.level < state.unlocked) {
        state.level++;
        saveState();
        resetRound(false);
    } else {
        $("message").textContent = "🔒 كمل المرحلة الحالية أولاً!";
    }
});
$("sound").addEventListener("click", () => {
    state.sound = !state.sound;
    saveState();
    updateUI();
    if (!state.sound && "speechSynthesis" in window) speechSynthesis.cancel();
});
$("reset").addEventListener("click", () => {
    if (!confirm("متأكد تريد تمسح كل تقدمك؟")) return;
    state = structuredClone(DEFAULT_STATE);
    saveState();
    resetRound(true);
});
$("modalNext").addEventListener("click", goNext);

$("targetBtn").addEventListener("click", () => {
    shout();
});

document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.key === "Enter") {
        e.preventDefault();
        shout();
    }
});

window.addEventListener("beforeunload", () => {
    stopTimer();
    saveState();
});

resetRound(true);
updateUI();

function getAchievementProgress() {
    return ACHIEVEMENTS.map(item => ({
        id: item.id,
        name: item.name,
        threshold: item.threshold,
        reward: item.reward,
        unlocked: state.totalShouts >= item.threshold
    }));
}

function checkAchievements() {
    const progress = getAchievementProgress();
    let changed = false;
    progress.forEach(item => {
        if (item.unlocked && !state["achievement_" + item.id]) {
            state["achievement_" + item.id] = true;
            state.coins += item.reward;
            changed = true;
        }
    });
    if (changed) {
        saveState();
        $("coins").textContent = state.coins;
    }
    return progress;
}

function achievementCount() {
    return getAchievementProgress().filter(item => item.unlocked).length;
}

function achievementRewardTotal() {
    return getAchievementProgress()
        .filter(item => item.unlocked)
        .reduce((sum, item) => sum + item.reward, 0);
}

function showAchievementStatus() {
    const count = achievementCount();
    if (count > 0) {
        $("message").textContent = "🏅 إنجازات مفتوحة: " + count;
    }
}

const originalShoutForAchievements = shout;
shout = function() {
    originalShoutForAchievements();
    if (started) {
        checkAchievements();
        if (state.totalShouts % 10 === 0) {
            showAchievementStatus();
        }
    }
};

function getLevelBest(id) {
    return Number(state.bestScore[id] || 0);
}

function totalBestScores() {
    return Object.values(state.bestScore)
        .map(Number)
        .reduce((sum, value) => sum + value, 0);
}

function unlockedLevelCount() {
    return Math.max(1, Math.min(LEVELS.length, state.unlocked));
}

function progressPercent() {
    return Math.round((unlockedLevelCount() / LEVELS.length) * 100);
}

function saveAchievementSnapshot() {
    state.achievementSnapshot = {
        count: achievementCount(),
        rewards: achievementRewardTotal(),
        levels: unlockedLevelCount(),
        totalBest: totalBestScores()
    };
    saveState();
}

function refreshPersistentStats() {
    checkAchievements();
    saveAchievementSnapshot();
    updateUI();
}

window.addEventListener("focus", refreshPersistentStats);
window.addEventListener("online", refreshPersistentStats);
